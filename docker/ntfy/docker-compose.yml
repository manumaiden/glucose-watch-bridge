services:
  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    command: serve
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ./cache:/var/cache/ntfy          # message cache + user database (auth.db)
      - ./config/server.yml:/etc/ntfy/server.yml
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -q '\"healthy\":true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
